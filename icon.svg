<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#0a1a13"/>
      <stop offset="45%" stop-color="#050b08"/>
      <stop offset="100%" stop-color="#08140e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <polygon points="256,140 372,256 256,372 140,256" fill="#a8e85f" filter="url(#glow)"/>
</svg>
